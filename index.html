<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Signature Cut by Tracy – Le jeu</title>
  <meta name="description" content="Le jeu du salon Signature Cut by Tracy à Pau : coupez, encaissez, débloquez toutes les prestations et gagnez un code de réduction.">
  <meta name="theme-color" content="#1c1a17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div id="app">
    <header id="hud">
      <img id="logo" src="img/logo.jpg" alt="Signature Cut by Tracy">
      <div class="hud-right">
        <div class="chip money"><span class="coin">€</span><b id="money">0</b></div>
        <div class="chip level"><b id="lvl-n">Niv. 1</b><span class="xp"><i id="xp"></i></span></div>
        <button id="rank" type="button" aria-label="Classement" title="Classement">🏆</button>
        <button id="snd" type="button" aria-label="Activer ou couper le son"></button>
      </div>
    </header>

    <main id="play">
      <section id="order">
        <div class="order-line"><span id="order-svc"></span><b id="order-price"></b></div>
        <div class="order-sub" id="order-cut"></div>
        <div class="bar"><i id="bar"></i><div id="ticks"></div></div>
      </section>

      <section id="stage">
        <canvas id="cv" aria-label="Le client dans le fauteuil : touchez pour couper"></canvas>
        <div id="floats"></div>
        <div id="combo"><span id="combo-txt"></span><i><b id="combo-bar"></b></i></div>
        <div id="hint">Touchez les cheveux pour couper</div>
        <div id="seats"></div>
        <button id="offer" type="button" hidden></button>
        <div id="toast" role="status"></div>
      </section>

      <button id="gift" type="button"></button>
    </main>

    <section id="side">
      <nav id="tabs">
        <button data-tab="tools" class="on">Outils</button>
        <button data-tab="biz">Mon salon</button>
        <button data-tab="menu">Carte</button>
        <button data-tab="cuts">Album</button>
        <button data-tab="salon">Infos</button>
      </nav>
      <div id="panel"></div>
    </section>

    <div id="modal" hidden>
      <div class="sheet">
        <div id="modal-body"></div>
        <button id="modal-ok" type="button" class="btn">Continuer</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=7"></script>
</body>
</html>
